name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hoshi.sln

      - name: Build
        run: dotnet build Hoshi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Hoshi.sln --configuration Release --no-build --logger "trx;LogFilePrefix=${{ runner.os }}" --results-directory TestResults

      - name: Report failed tests
        if: failure()
        run: python3 tools/ci/trx_annotations.py TestResults || python tools/ci/trx_annotations.py TestResults
        shell: bash

      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: |
            TestResults/
            tests/**/bin/Release/**/screenshots/*.png
          if-no-files-found: ignore
