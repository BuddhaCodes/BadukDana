name: Release

# Runs after CI has passed on main (build + tests on Windows, macOS and Linux), so a release never ships a
# broken build. It builds self-contained Hoshi apps (no .NET needed) and publishes them as a GitHub Release,
# fully automatically: Velopack installers (Windows Setup.exe, macOS .pkg, Linux .AppImage) with delta updates,
# one channel per system and processor (win-x64, osx-arm64, linux-x64…), plus the plain archives
# (Hoshi-windows-x64.zip…), from which copies installed before the installer existed still update. The version is <major.minor from Directory.Build.props>.<run number>, e.g. 0.1.7; the tag
# v0.1.7 is created by the release step. Asset names carry no version, so
# https://github.com/BuddhaCodes/BadukDana/releases/latest/download/<asset> always points at the newest build.
# When nothing but the website, Markdown or workflow files changed since the last release, nothing is published.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: Anything to release?
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: diff
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$last" HEAD | grep -vE '^(docs/|\.github/)|\.md$' || true)
          echo "Changed since $last:"; echo "$changed"
          [ -n "$changed" ] && echo "release=true" >> "$GITHUB_OUTPUT" || echo "release=false" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.rid }}
    needs: changes
    if: needs.changes.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     asset: Hoshi-windows-x64.zip }
          - { os: windows-latest, rid: win-arm64,   asset: Hoshi-windows-arm64.zip }
          - { os: macos-latest,   rid: osx-arm64,   asset: Hoshi-macos-arm64.zip }
          - { os: macos-latest,   rid: osx-x64,     asset: Hoshi-macos-x64.zip }
          - { os: ubuntu-latest,  rid: linux-x64,   asset: Hoshi-linux-x64.tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, asset: Hoshi-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: v
        shell: bash
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=${base:-0.1}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Hoshi.App/Hoshi.App.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o out/Hoshi

      - name: Bundle KataGo (official build + Hoshi's network)
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            zip=katago-v1.17.1-opencl-windows-x64.zip; sum=68d0a9b11ef7e3c1ddfc5bcd400306ca66c3770dd67a22cb377d3aaaf32e8c66
          else
            zip=katago-v1.17.1-opencl-linux-x64.zip; sum=be537295868c0b8ff6985e62e411fff67cbba2dc872343c74896063de1ef51e9
          fi
          curl -sSfL -o kg.zip "https://github.com/lightvector/KataGo/releases/download/v1.17.1/$zip"
          echo "$sum  kg.zip" | sha256sum -c -
          mkdir -p kg out/Hoshi/katago
          (cd kg && cmake -E tar xf ../kg.zip)
          find kg -type f \( -iname 'katago' -o -iname 'katago.exe' -o -iname '*.dll' -o -iname 'cacert.pem' \) -exec cp {} out/Hoshi/katago/ \;
          find kg -type f -iname 'README.txt' -exec cp {} out/Hoshi/katago/KataGo-README.txt \;
          cp engines/katago/b10c128.txt.gz out/Hoshi/katago/
          [ -f out/Hoshi/katago/katago ] && chmod +x out/Hoshi/katago/katago
          ls -la out/Hoshi/katago

      - name: Prepare files
        shell: bash
        run: |
          rm -f out/Hoshi/appsettings.Development.json
          cp -R THIRD_PARTY_NOTICES.md licenses out/Hoshi/

      - name: macOS app bundle
        if: runner.os == 'macOS'
        run: |
          set -e
          app=out/Hoshi.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R out/Hoshi/. "$app/Contents/MacOS/"
          sed "s/__VERSION__/${{ steps.v.outputs.version }}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir hoshi.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s src/Hoshi.App/Assets/hoshi.png --out hoshi.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d src/Hoshi.App/Assets/hoshi.png --out hoshi.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns hoshi.iconset -o "$app/Contents/Resources/hoshi.icns"
          chmod +x "$app/Contents/MacOS/Hoshi"
          # Ad-hoc signature: required for Apple Silicon to run it at all (not a Developer ID, see the website).
          codesign --force --deep --sign - "$app"

      # ---------------- Velopack: installer + update packages for this channel ----------------
      - name: Velopack tools
        shell: bash
        run: |
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -q squashfs-tools zstd; fi
          if [ "$RUNNER_OS" = "macOS" ]; then command -v zstd || brew install zstd; fi

      - name: Previous release (for the delta update)
        shell: bash
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -c ${{ matrix.rid }} -o vp

      - name: Velopack pack
        shell: bash
        run: |
          set -e
          common=(-u HoshiGo -v ${{ steps.v.outputs.version }} -c ${{ matrix.rid }} -r ${{ matrix.rid }} -o vp
                  --packTitle Hoshi --packAuthors "Hoshi contributors")
          case "$RUNNER_OS" in
            Windows) vpk pack "${common[@]}" -p out/Hoshi -e Hoshi.exe -i src/Hoshi.App/Assets/hoshi.ico ;;
            Linux)   vpk pack "${common[@]}" -p out/Hoshi -e Hoshi -i src/Hoshi.App/Assets/hoshi.png --categories Game ;;
            macOS)
              # Ad-hoc signature so the bundle stays valid with Velopack's updater inside; unsigned if vpk refuses.
              if ! vpk pack "${common[@]}" -p out/Hoshi.app -e Hoshi --signAppIdentity -; then
                echo "::warning::ad-hoc signing through vpk failed; packing unsigned"
                vpk pack "${common[@]}" -p out/Hoshi.app -e Hoshi
              fi ;;
          esac
          ls -la vp

      # ---------------- Plain archives: copies installed before the installer existed update from these ----------------
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path out/Hoshi -DestinationPath ${{ matrix.asset }}

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent out/Hoshi.app ${{ matrix.asset }}

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          cp packaging/linux/hoshi.desktop packaging/linux/install.sh src/Hoshi.App/Assets/hoshi.png out/Hoshi/
          chmod +x out/Hoshi/Hoshi out/Hoshi/install.sh
          tar -C out -czf ${{ matrix.asset }} Hoshi

      - uses: actions/upload-artifact@v4
        with:
          name: vp-${{ matrix.rid }}
          path: vp
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: legacy-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: vp-*
          path: vp

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          sparse-checkout: |
            Directory.Build.props
            global.json
            engines/katago
          sparse-checkout-cone-mode: false
          path: src-props

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src-props/global.json

      - name: Network asset (downloaded by "Install KataGo")
        run: cp src-props/engines/katago/b10c128.txt.gz assets/Hoshi-katago-b10c128.txt.gz

      - name: Checksums (checked by the updater of copies installed before the installer existed)
        run: cd assets && sha256sum Hoshi-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Tag
        id: tag
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' src-props/Directory.Build.props | head -1)
          echo "tag=v${base:-0.1}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # A draft first: nothing is visible (or offered as an update) until every system's files are attached.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Hoshi ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: assets/*
          body: |
            **Install Hoshi** and it keeps itself up to date (only the changes are downloaded):
            Windows: HoshiGo-win-x64-Setup.exe (ARM: HoshiGo-win-arm64-Setup.exe) · macOS: HoshiGo-osx-arm64-Setup.pkg (Apple Silicon) or HoshiGo-osx-x64-Setup.pkg (Intel) · Linux: HoshiGo-linux-x64.AppImage (ARM: HoshiGo-linux-arm64.AppImage)
            Portable, no installer: HoshiGo-*-Portable.zip, or the classic Hoshi-windows-x64.zip / Hoshi-macos-*.zip / Hoshi-linux-*.tar.gz.
            The builds are not signed by Microsoft or Apple yet; the website explains the first-launch warning.

      - name: Velopack packages and update feeds (one channel per system), then publish
        run: |
          set -e
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          rids=(win-x64 win-arm64 osx-arm64 osx-x64 linux-x64 linux-arm64)
          last=${rids[${#rids[@]}-1]}
          for rid in "${rids[@]}"; do
            publish=(); [ "$rid" = "$last" ] && publish=(--publish)
            vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} \
              --tag ${{ steps.tag.outputs.tag }} --releaseName "Hoshi ${{ steps.tag.outputs.tag }}" --merge \
              -c "$rid" -o "vp/vp-$rid" "${publish[@]}"
          done
