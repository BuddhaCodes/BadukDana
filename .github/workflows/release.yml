name: Release

# Every push to main builds self-contained Hoshi apps (no .NET needed on the user's machine) and publishes them
# as a new GitHub Release, fully automatically. The version is <Version from Directory.Build.props without its
# patch number>.<run number>, e.g. 0.1.7, and the tag v0.1.7 is created by the release step.
# Asset names carry no version, so https://github.com/BuddhaCodes/BadukDana/releases/latest/download/<asset>
# always points at the newest build (the website links there).
# Pushes that only touch the website or Markdown files do not make a new release.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,     asset: Hoshi-windows-x64.zip }
          - { os: windows-latest, rid: win-arm64,   asset: Hoshi-windows-arm64.zip }
          - { os: macos-latest,   rid: osx-arm64,   asset: Hoshi-macos-arm64.zip }
          - { os: macos-latest,   rid: osx-x64,     asset: Hoshi-macos-x64.zip }
          - { os: ubuntu-latest,  rid: linux-x64,   asset: Hoshi-linux-x64.tar.gz }
          - { os: ubuntu-latest,  rid: linux-arm64, asset: Hoshi-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: v
        shell: bash
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=${base:-0.1}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Hoshi.App/Hoshi.App.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=${{ steps.v.outputs.version }} -o out/Hoshi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item out/Hoshi/appsettings.Development.json -ErrorAction SilentlyContinue
          Copy-Item THIRD_PARTY_NOTICES.md, licenses out/Hoshi -Recurse
          Compress-Archive -Path out/Hoshi -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        run: |
          set -e
          app=out/Hoshi.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          rm -f out/Hoshi/appsettings.Development.json
          cp -R out/Hoshi/. "$app/Contents/MacOS/"
          sed "s/__VERSION__/${{ steps.v.outputs.version }}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          mkdir hoshi.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s src/Hoshi.App/Assets/hoshi.png --out hoshi.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d src/Hoshi.App/Assets/hoshi.png --out hoshi.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns hoshi.iconset -o "$app/Contents/Resources/hoshi.icns"
          cp -R THIRD_PARTY_NOTICES.md licenses "$app/Contents/Resources/"
          chmod +x "$app/Contents/MacOS/Hoshi"
          # Ad-hoc signature: required for Apple Silicon to run it at all (not a Developer ID, see the website).
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          rm -f out/Hoshi/appsettings.Development.json
          cp packaging/linux/hoshi.desktop packaging/linux/install.sh src/Hoshi.App/Assets/hoshi.png out/Hoshi/
          cp -R THIRD_PARTY_NOTICES.md licenses out/Hoshi/
          chmod +x out/Hoshi/Hoshi out/Hoshi/install.sh
          tar -C out -czf ${{ matrix.asset }} Hoshi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums (verified by Hoshi's updater)
        run: cd assets && sha256sum Hoshi-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/checkout@v4
        with:
          sparse-checkout: Directory.Build.props
          path: src-props

      - name: Tag
        id: tag
        run: |
          base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\)\..*</Version>.*:\1:p' src-props/Directory.Build.props | head -1)
          echo "tag=v${base:-0.1}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hoshi ${{ steps.tag.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: assets/*
          body: |
            Download the file for your system, unpack it and run Hoshi — no .NET install needed.
            Windows: Hoshi-windows-x64.zip → Hoshi.exe · macOS: Hoshi-macos-arm64.zip (Apple Silicon) or -x64 (Intel) → Hoshi.app · Linux: Hoshi-linux-x64.tar.gz → ./install.sh or ./Hoshi
            The builds are not signed by Microsoft or Apple yet; the website explains the first-launch warning.
